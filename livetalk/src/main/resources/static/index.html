<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>간단 회원가입/로그인 + 채팅 UI</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #121a33;
      --muted: #8ea0c7;
      --text: #eaf0ff;
      --border: rgba(255, 255, 255, 0.12);
      --accent: #6ea8ff;
      --danger: #ff6e6e;
      --ok: #5dff9a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: radial-gradient(1200px 800px at 20% 10%, #16214a 0%, var(--bg) 55%, #070a14 100%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(980px, 100%);
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border: 1px solid var(--border);
      background: rgba(18, 26, 51, 0.72);
      backdrop-filter: blur(10px);
      border-radius: 14px;
    }

    .header .title {
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .header .sub {
      color: var(--muted);
      font-size: 13px;
    }

    .header .right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pill {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: rgba(0, 0, 0, 0.18);
    }

    .btn {
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.18);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform .06s ease, background .2s ease, border-color .2s ease;
      user-select: none;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.primary {
      background: rgba(110, 168, 255, 0.18);
      border-color: rgba(110, 168, 255, 0.45);
    }

    .btn.danger {
      background: rgba(255, 110, 110, 0.12);
      border-color: rgba(255, 110, 110, 0.35);
      color: #ffd2d2;
    }

    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr;
    }

    @media (min-width: 860px) {
      .grid {
        grid-template-columns: 1fr 1.3fr;
      }
    }

    .card {
      border: 1px solid var(--border);
      background: rgba(18, 26, 51, 0.72);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      overflow: hidden;
    }

    .card .card-h {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .card .card-h h2 {
      margin: 0;
      font-size: 15px;
    }

    .card .card-h .hint {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .card .card-b {
      padding: 16px;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row>* {
      flex: 1;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.18);
      color: var(--text);
      outline: none;
    }

    input:focus {
      border-color: rgba(110, 168, 255, 0.55);
      box-shadow: 0 0 0 3px rgba(110, 168, 255, 0.12);
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .msg {
      margin-top: 10px;
      font-size: 13px;
    }

    .msg.ok {
      color: var(--ok);
    }

    .msg.err {
      color: var(--danger);
    }

    /* Chat */
    .chatWrap {
      display: flex;
      flex-direction: column;
      height: 560px;
    }

    .chatHead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .chatHead .left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .chatHead .left .room {
      font-weight: 800;
    }

    .chatHead .left .me {
      font-size: 12px;
      color: var(--muted);
    }

    .chatBody {
      padding: 14px 14px 0;
      overflow: auto;
      flex: 1;
    }

    .bubble {
      max-width: 78%;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.18);
      margin-bottom: 10px;
      line-height: 1.35;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble.mine {
      margin-left: auto;
      border-color: rgba(110, 168, 255, 0.35);
      background: rgba(110, 168, 255, 0.14);
    }

    .meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }

    .chatFoot {
      padding: 12px 14px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: end;
    }

    textarea {
      width: 100%;
      min-height: 44px;
      max-height: 140px;
      resize: vertical;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.18);
      color: var(--text);
      outline: none;
      line-height: 1.3;
    }

    textarea:focus {
      border-color: rgba(110, 168, 255, 0.55);
      box-shadow: 0 0 0 3px rgba(110, 168, 255, 0.12);
    }

    .hidden {
      display: none !important;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 12px 0;
    }

    .kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.2);
      color: var(--muted);
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

</head>

<body>
  <div class="app">
    <div class="header">
      <div>
        <div class="title">Demo: 회원가입 / 로그인 / 채팅</div>
      </div>
      <div class="right">
        <span class="pill" id="statusPill">로그아웃 상태</span>
        <button class="btn danger hidden" id="logoutBtn">로그아웃</button>
      </div>
    </div>

    <div class="grid">
      <!-- Auth card -->
      <div class="card" id="authCard">
        <div class="card-h">
          <h2>회원 / 인증</h2>
          <p class="hint">회원가입 후 로그인</p>
        </div>
        <div class="card-b">
          <div class="row">
            <div>
              <label for="signupId">회원가입 아이디</label>
              <input id="signupId" autocomplete="username" placeholder="예) honggildong" />
            </div>
            <div>
              <label for="signupPw">회원가입 비밀번호</label>
              <input id="signupPw" type="password" autocomplete="new-password" placeholder="••••••••" />
            </div>
          </div>
          <div class="actions">
            <button class="btn primary" id="signupBtn">회원가입</button>
          </div>
          <div class="msg" id="signupMsg"></div>

          <div class="divider"></div>

          <div class="row">
            <div>
              <label for="loginId">로그인 아이디</label>
              <input id="loginId" autocomplete="username" placeholder="아이디" />
            </div>
            <div>
              <label for="loginPw">로그인 비밀번호</label>
              <input id="loginPw" type="password" autocomplete="current-password" placeholder="비밀번호" />
            </div>
          </div>
          <div class="actions">
            <button class="btn primary" id="loginBtn">로그인</button>
          </div>
          <div class="msg" id="loginMsg"></div>
        </div>
      </div>

      <!-- Chat card -->
      <div class="card" id="chatCard">
        <div class="chatWrap">
          <div class="chatHead">
            <div class="left">
              <div class="room">실시간 대화창 (Demo)</div>
              <div class="me" id="meLine">로그인 필요</div>
            </div>
            <div class="right">
              <button class="btn hidden" id="clearChatBtn">대화 지우기</button>
            </div>
          </div>

          <div class="chatBody" id="chatBody">
            <div class="bubble">
              로그인하면 채팅을 사용할 수 있어요.
              <div class="meta">안내</div>
            </div>
          </div>

          <div class="chatFoot">
            <textarea id="chatInput" placeholder="메시지를 입력하세요 (Enter: 전송, Shift+Enter: 줄바꿈)" disabled></textarea>
            <button class="btn primary" id="sendBtn" disabled>전송</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const $ = (sel) => document.querySelector(sel);

    const signupId = $("#signupId");
    const signupPw = $("#signupPw");
    const signupMsg = $("#signupMsg");
    const signupBtn = $("#signupBtn");

    const loginId = $("#loginId");
    const loginPw = $("#loginPw");
    const loginMsg = $("#loginMsg");
    const logoutBtn = $("#logoutBtn");
    const loginBtn = $("#loginBtn");
    const statusPill = $("#statusPill");   

    const chatBody = $("#chatBody");
    const chatInput = $("#chatInput");
    const sendBtn = $("#sendBtn");
    const clearChatBtn = $("#clearChatBtn");
    const meLine = $("#meLine");

    let token = null;
    let memberId = null;

    let socket = null;
    let stompClient = null;
    let isConnecting = false;

    function connectStomp() {
      if (!token) return;
      if (stompClient?.connected || isConnecting) return;

      disconnectStomp();

      isConnecting = true;
      socket = new SockJS("/ws");
      stompClient = Stomp.over(socket);

      stompClient.connect({
        Authorization: "Bearer " + token
      }, frame => {
        isConnecting = false;

        stompClient.subscribe('/topic/public', (msg) => {
          const data = JSON.parse(msg.body);
          let mine = true;

          if (!!memberId && memberId !== data.memberId) {
            mine = false;
          }

          addBubble(data.talkMessage, mine, `${data.memberId} · ${nowTime(data.createdAt)}`);
        }, (error) => {
          isConnecting = false;
        });
      });
    }

    function disconnectStomp() {
      if (stompClient?.connected) stompClient.disconnect();
      stompClient = null;
      socket = null;
      isConnecting = false;
    }

    function clearSession() {
      token = null;
      memberId = null;
    }

    function setMsg(el, text, type) {
      el.className = "msg " + (type || "");
      el.textContent = text || "";
    }

    function nowTime(input = new Date()) {
      const date =
        typeof input === "string"
          ? new Date(input.replace(" ", "T"))
          : input;

      return date.toLocaleTimeString("ko-KR", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });
    }

    function addBubble(text, mine = false, meta = "") {
      const wrap = document.createElement("div");
      wrap.className = "bubble" + (mine ? " mine" : "");
      wrap.textContent = text;

      const m = document.createElement("div");
      m.className = "meta";
      m.textContent = meta || nowTime();

      wrap.appendChild(m);
      chatBody.appendChild(wrap);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function setLoggedInUI(memberId) {
      const loggedIn = !!memberId;

      statusPill.textContent = loggedIn ? `로그인: ${memberId}` : "로그아웃 상태";
      logoutBtn.classList.toggle("hidden", !loggedIn);

      chatInput.disabled = !loggedIn;
      sendBtn.disabled = !loggedIn;
      clearChatBtn.classList.toggle("hidden", !loggedIn);

      meLine.textContent = loggedIn ? `${memberId} 님으로 접속 중` : "로그인 필요";

      if (loggedIn) {
        // greet once
        addBubble(`환영합니다, ${memberId}님! 메시지를 보내보세요.`, false, "시스템");
      }
    }

    async function postData(url, body) {
      const response = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      });

      const data = await response.json();

      if (!response.ok) {
        throw data;
      }

      return data;
    }

    // ====== 회원가입 ======
    signupBtn.addEventListener("click", async () => {
      const id = signupId.value.trim();
      const pw = signupPw.value.trim();

      if (id.length < 3) return setMsg(signupMsg, "아이디는 3자 이상으로 입력하세요.", "err");
      if (pw.length < 4) return setMsg(signupMsg, "비밀번호는 4자 이상으로 입력하세요.", "err");

      const body = {
        "memberId": id,
        "password": pw
      };

      try {
        await postData("http://localhost:8080/api/member", body);
        setMsg(signupMsg, "회원가입 완료! 이제 로그인하세요.", "ok");
        signupId.value = "";
        signupPw.value = "";
      } catch (e) {
        setMsg(signupMsg, e.message, "err");
      }

    });

    // ====== 로그인 ======
    function setLoginButtonDisabled(state){
      loginId.disabled = state;
      loginPw.disabled = state;
      loginBtn.disabled = state;
    }

    loginBtn.addEventListener("click", async () => {
      const id = loginId.value.trim();
      const pw = loginPw.value;

      if (!id.length) return setMsg(loginMsg, "아이디를 입력하세요.", "err");
      if (!pw.length) return setMsg(loginMsg, "비밀번호를 입력하세요.", "err");

      const body = {
        "memberId": id,
        "password": pw
      };

      try {
        const reuslt = await postData("http://localhost:8080/api/member/login", body);

        token = reuslt.data.token;
        memberId = reuslt.data.memberId;
        setLoggedInUI(reuslt.data.memberId);
        setMsg(loginMsg, "로그인 성공!", "ok");
        connectStomp();

        loginPw.value = "";
        setLoginButtonDisabled(true);
      } catch (e) {
        setMsg(loginMsg, e.message, "err");
      }

    });

    // ====== 로그아웃 ======
    logoutBtn.addEventListener("click", () => {
      clearSession();
      setLoggedInUI(null);
      disconnectStomp();
      setLoginButtonDisabled(false);
      setMsg(loginMsg, "로그아웃 되었습니다.", "ok");
    });

    // ====== 채팅 ======
    clearChatBtn.addEventListener("click", () => {
      chatBody.innerHTML = "";
      addBubble("대화가 초기화되었습니다.", false, "시스템");
    });

    function sendChat() {
      if (!token) return;

      const text = chatInput.value.trim();
      if (!text) return;

      stompClient.send("/app/talk", {}, JSON.stringify({
        "talkMessage": text
      }));

      chatInput.value = "";
    }

    sendBtn.addEventListener("click", sendChat);

    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        if (!sendBtn.disabled) sendChat();
      }
    });

    // ====== Init ======
    setLoggedInUI(memberId);
  </script>
</body>

</html>
